name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:verify
      - name: Package plugin
        shell: bash
        run: |
          mkdir -p release
          zip "release/vaultpix-${GITHUB_REF_NAME#v}.zip" main.js manifest.json styles.css
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css release/*.zip --generate-notes --verify-tag
